version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam_platform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exam_platform_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: exam_platform_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/exam_db
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: exam_platform_worker
    restart: always
    command: python3 -m app.workers.grading_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/exam_db
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
